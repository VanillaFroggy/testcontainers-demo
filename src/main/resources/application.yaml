spring:
  application:
    name: testcontainers-demo
  datasource:
    # Указываем явно, что используем in-memory базу данных H2
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ''
    # Опционально: инициализировать схему БД при запуске
    # initialization-mode: always
    h2:
      # Включаем консоль H2 для отладки (доступна по адресу http://localhost:8080/h2-console)
      console:
        enabled: true
        path: /h2-console
